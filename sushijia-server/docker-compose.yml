version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: sushijia-mysql
    environment:
      MYSQL_ROOT_PASSWORD: sushijia123
      MYSQL_DATABASE: sushijia
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
    networks:
      - sushijia

  redis:
    image: redis:7-alpine
    container_name: sushijia-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    networks:
      - sushijia

  hotel:
    image: openjdk:17-slim
    container_name: sushijia-hotel
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-string-32chars}
      MYSQL_HOST: mysql
      REDIS_HOST: redis
    volumes:
      - ./sushijia-hotel/target/sushijia-hotel-1.0.0.jar:/app/app.jar
    working_dir: /app
    command: java -jar app.jar
    networks:
      - sushijia
    restart: unless-stopped

  admin:
    image: openjdk:17-slim
    container_name: sushijia-admin
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-string-32chars}
      MYSQL_HOST: mysql
      REDIS_HOST: redis
    volumes:
      - ./sushijia-admin/target/sushijia-admin-1.0.0.jar:/app/app.jar
    working_dir: /app
    command: java -jar app.jar
    networks:
      - sushijia
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:

networks:
  sushijia:
    driver: bridge
