services:
  mysql:
    image: mysql:8.0
    container_name: sushijia-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sushijia}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sushijia-server/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sushijia

  redis:
    image: redis:7-alpine
    container_name: sushijia-redis
    command: redis-server --requirepass yudao123
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "yudao123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sushijia
        
  hotel:
    build:
      context: ./sushijia-server
      dockerfile: Dockerfile
      args:
        MODULE: sushijia-hotel
    image: sushijia-hotel:v1
    container_name: sushijia-hotel
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-string-32chars}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sushijia}
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: 0
      REDIS_PASSWORD: yudao123
      SUSHIJIA_KNOWLEDGE_STORAGE: /app/data/knowledge
      AMAP_WEB_KEY: a384a53e24c9a1109fad80a75d9e339f
      TZ: Asia/Shanghai
    volumes:
      - hotel_data:/app/data
    restart: unless-stopped
    networks:
      - sushijia

  admin:
    build:
      context: ./sushijia-server
      dockerfile: Dockerfile
      args:
        MODULE: sushijia-admin
    image: sushijia-admin:v1
    container_name: sushijia-admin
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-string-32chars}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sushijia}
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: 0
      REDIS_PASSWORD: yudao123
      TZ: Asia/Shanghai
    restart: unless-stopped
    networks:
      - sushijia

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: sushijia-web:v1
    container_name: sushijia-web
    depends_on:
      - hotel
      - admin
    ports:
      - "27808:80"
    restart: unless-stopped
    networks:
      - sushijia

volumes:
  mysql_data:
  redis_data:
  hotel_data:

networks:
  sushijia:
    driver: bridge
