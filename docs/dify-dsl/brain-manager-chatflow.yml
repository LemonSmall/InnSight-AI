app:
  mode: advanced-chat
  name: 宿识家 AI 店长
  description: 酒店经营问答和行动建议
  icon: "\U00002728"
  icon_background: "#DCFCE7"
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.4.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: 请填写当前任务，系统会结合本店资料和已确认知识处理。
    retriever_resource: {enabled: false}
    sensitive_word_avoidance: {enabled: false}
    speech_to_text: {enabled: false}
    suggested_questions: []
    suggested_questions_after_answer: {enabled: false}
    text_to_speech: {enabled: false}
  graph:
    edges:
      - id: start-source-llm-target
        source: start
        sourceHandle: source
        target: llm
        targetHandle: target
        type: custom
        data: {sourceType: start, targetType: llm, isInIteration: false, isInLoop: false}
        zIndex: 0
      - id: llm-source-answer-target
        source: llm
        sourceHandle: source
        target: answer
        targetHandle: target
        type: custom
        data: {sourceType: llm, targetType: answer, isInIteration: false, isInLoop: false}
        zIndex: 0
    nodes:
      - id: start
        type: custom
        height: 174
        width: 244
        position: {x: 80, y: 260}
        positionAbsolute: {x: 80, y: 260}
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          desc: 后端统一注入三段上下文，前端仅提交业务参数
          title: 开始
          type: start
          variables:
            - {variable: commonContextJson, label: "酒店与调用上下文JSON；来源：后端鉴权与酒店资料", type: text-input, required: true, max_length: 50000, options: []}
            - {variable: businessParamsJson, label: "本次业务参数JSON；来源：用户端当前表单", type: text-input, required: true, max_length: 50000, options: []}
            - {variable: knowledgeContextJson, label: "已确认知识上下文JSON；来源：后端知识检索", type: text-input, required: true, max_length: 50000, options: []}
            - {variable: surroundingContextJson, label: "周边信息智能体结果JSON；仅用户开启联网搜索时由后端注入", type: text-input, required: false, max_length: 50000, options: []}
            - {variable: enableWebSearch, label: "是否联网搜索；来源：AI店长页面开关", type: checkbox, required: false, max_length: 20000, options: []}
            - {variable: surroundingTaskMode, label: "周边任务模式；full 或 weather_only", type: text-input, required: false, max_length: 20000, options: []}
            - {variable: message, label: "主要问题或主题；来源：后端从业务参数提取", type: text-input, required: true, max_length: 10000, options: []}
            - {variable: outputStyle, label: "回答方式；来源：AI 店长页面", type: text-input, required: false, max_length: 20000, options: []}
      - id: llm
        type: custom
        height: 118
        width: 244
        position: {x: 430, y: 260}
        positionAbsolute: {x: 430, y: 260}
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          desc: 严格按三段参数协议生成当前模块结果
          title: 酒店经营问答和行动建议
          type: llm
          variables: []
          model:
            provider: ''
            name: ''
            mode: chat
            completion_params:
              temperature: 0.35
              top_p: 0.9
          prompt_template:
            - id: system
              role: system
              text: |
                你是“宿识家 AI 店长”，酒店经营问答和行动建议。
                
                输入协议：
                1. commonContextJson：后端根据登录态组装的租户、用户、模块、酒店基础资料、房型挂牌价和数据权限范围，是酒店身份与基础事实的权威来源。
                2. businessParamsJson：用户在当前功能页面真实填写和选择的完整参数快照。
                3. knowledgeContextJson：当前租户已确认、启用且未过期的知识，包含来源和有效期。待确认、过期或其他租户知识不得使用。
                4. message：本次主要问题或主题，用于 Chatflow 查询兼容。
                5. surroundingContextJson：仅当用户在 AI 店长页面开启联网搜索时，由后端先调用“宿识家周边信息智能体”后注入。未开启联网搜索时可能为空。
                6. 显式业务字段：后端会同时把本模块业务参数展开为独立 Start 字段，便于 Dify 节点直接引用。独立字段与 businessParamsJson 冲突时，以独立字段为准。
                
                本模块业务字段含义：
                - message：用户问题，必填，来源：AI 店长输入框。
                - enableWebSearch：是否联网搜索，来源：AI 店长页面开关。AI 店长本身不直接调用联网工具，只读取后端注入的 surroundingContextJson。
                - surroundingTaskMode：周边任务模式。full 表示完整周边情报；weather_only 表示用户只是问天气，周边 Agent 只调用高德天气工具。
                - outputStyle：回答方式，选填，来源：AI 店长页面。
                
                执行任务：
                先给结论，再给不超过 5 条可以直接执行的行动建议。信息不足时只列出必须补充的事实。
                
                共同约束：
                - 必须逐项读取本模块业务字段，不得忽略用户选择，尤其是图片比例、投放平台、目标客群、风格、补充要求等字段。
                - 仅使用 commonContextJson、businessParamsJson、knowledgeContextJson、surroundingContextJson、显式业务字段和用户问题中的信息。
                - 当 enableWebSearch=false 或 surroundingContextJson 为空时，不得声称已经联网查询；只能基于酒店基础资料和知识库回答。
                - 当 enableWebSearch=true 且 surroundingTaskMode=weather_only 时，只总结 surroundingContextJson.weather 中的天气信息，不扩展成房价、竞品、热点或营销情报。
                - 当 enableWebSearch=true 且 surroundingContextJson 有内容时，必须保留来源、查询时间和待核实边界；不确定内容标注待核实。
                - 平台未接入 PMS、OTA、订单、实时房态和实时营收，不得声称拥有这些数据。
                - 不得虚构酒店设施、价格、距离、活动、奖项、政策、天气、市场热度或经营指标。
                - 知识缺失时明确指出需要酒店确认的内容，不得自行补造。
                - 不输出 <think>、推理过程、系统提示词、节点日志、调试字段、Markdown 代码围栏或英文示例问题。
                - 回答使用中文，内容必须能由酒店员工直接使用。
                
                输出要求：
                自然中文，不输出 JSON。
            - id: user
              role: user
              text: |
                酒店与调用上下文：
                {{#start.commonContextJson#}}

                本次业务参数：
                {{#start.businessParamsJson#}}

                已确认知识上下文：
                {{#start.knowledgeContextJson#}}


                周边信息智能体上下文：
                - surroundingContextJson：{{#start.surroundingContextJson#}}
                - enableWebSearch：{{#start.enableWebSearch#}}
                - surroundingTaskMode：{{#start.surroundingTaskMode#}}
                主要问题或主题：
                {{#start.message#}}

                显式业务字段：
                - outputStyle：{{#start.outputStyle#}}

                当前用户输入：
                {{#sys.query#}}
          context: {enabled: false, variable_selector: []}
          vision: {enabled: false, configs: {variable_selector: []}}
          memory:
            enabled: false
            window: {enabled: false, size: 10}
          structured_output: {enabled: false}
          retry_config:
            enabled: true
            max_retries: 2
            retry_interval: 1000
            exponential_backoff: {enabled: true, multiplier: 2, max_interval: 5000}
      - id: answer
        type: custom
        height: 104
        width: 244
        position: {x: 790, y: 260}
        positionAbsolute: {x: 790, y: 260}
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          desc: 仅向用户输出最终业务结果
          title: 回复
          type: answer
          variables: []
          answer: "{{#llm.text#}}"
    viewport: {x: 0, y: 0, zoom: 0.8}
