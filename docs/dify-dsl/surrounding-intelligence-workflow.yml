app:
  mode: workflow
  name: 宿识家周边信息智能体
  description: 根据绑定酒店、城市、入住日期和实时搜索能力汇总周边酒店价格、热门地点、事件和天气线索
  icon: "\U0001F4CD"
  icon_background: "#DCFCE7"
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.5.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: 请输入绑定酒店信息，系统会汇总周边实时经营线索。
    retriever_resource: {enabled: false}
    sensitive_word_avoidance: {enabled: false}
    speech_to_text: {enabled: false}
    suggested_questions: []
    suggested_questions_after_answer: {enabled: false}
    text_to_speech: {enabled: false}
  graph:
    edges:
      - id: start-source-llm-target
        source: start
        sourceHandle: source
        target: llm
        targetHandle: target
        type: custom
        data: {sourceType: start, targetType: llm, isInIteration: false, isInLoop: false}
        zIndex: 0
      - id: llm-source-end-target
        source: llm
        sourceHandle: source
        target: end
        targetHandle: target
        type: custom
        data: {sourceType: llm, targetType: end, isInIteration: false, isInLoop: false}
        zIndex: 0
    nodes:
      - id: start
        type: custom
        height: 174
        width: 244
        position: {x: 80, y: 260}
        positionAbsolute: {x: 80, y: 260}
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          desc: 后端传入绑定酒店和本次搜索参数
          title: 开始
          type: start
          variables:
            - {variable: commonContextJson, label: "酒店与调用上下文 JSON", type: text-input, required: true, max_length: 50000, options: []}
            - {variable: businessParamsJson, label: "本次周边搜索参数 JSON", type: text-input, required: true, max_length: 50000, options: []}
            - {variable: knowledgeContextJson, label: "已确认知识上下文JSON", type: text-input, required: false, max_length: 50000, options: []}
            - {variable: taskMode, label: "任务模式：full 或 weather_only", type: text-input, required: true, max_length: 20000, options: []}
            - {variable: query, label: "搜索任务/搜索意图", type: text-input, required: true, max_length: 10000, options: []}
            - {variable: checkIn, label: "入住日期", type: text-input, required: false, max_length: 20000, options: []}
            - {variable: checkOut, label: "离店日期", type: text-input, required: false, max_length: 20000, options: []}
            - {variable: hotelName, label: "绑定酒店名称（后端冗余）", type: text-input, required: false, max_length: 20000, options: []}
            - {variable: city, label: "城市（后端冗余）", type: text-input, required: false, max_length: 20000, options: []}
            - {variable: address, label: "地址（后端冗余）", type: text-input, required: false, max_length: 20000, options: []}
            - {variable: longitude, label: "经度（后端冗余）", type: text-input, required: false, max_length: 20000, options: []}
            - {variable: latitude, label: "纬度（后端冗余）", type: text-input, required: false, max_length: 20000, options: []}
            - {variable: message, label: "兼容搜索指令", type: text-input, required: false, max_length: 10000, options: []}
      - id: llm
        type: custom
        height: 118
        width: 244
        position: {x: 430, y: 260}
        positionAbsolute: {x: 430, y: 260}
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          desc: 使用模型联网搜索能力汇总真实周边信息
          title: 周边实时信息汇总
          type: llm
          variables: []
          model:
            provider: ''
            name: ''
            mode: chat
            completion_params:
              temperature: 0.2
              top_p: 0.9
          prompt_template:
            - id: system
              role: system
              text: |
                你是“宿识家周边信息智能体”，角色是外部情报搜索员，不是 AI 店长，不做最终定价决策，不输出营销方案。

                你的唯一任务是读取 commonContextJson、businessParamsJson、knowledgeContextJson、taskMode 和 query，调用指定工具获取可核验公开信息，并整理为结构化 JSON。

                项目真实数据来源说明：
                - commonContextJson.hotel.realWorldBinding：后端绑定的酒店 POI、名称、地址、城市、经纬度、商圈、房型与挂牌价等真实资料。
                - businessParamsJson：本次周边检索场景、入住/离店日期、搜索半径、检索目标、平台/业态限制等业务参数。
                - knowledgeContextJson：租户已确认知识，可辅助判断酒店定位，但不能替代实时公开来源。
                - taskMode：后端根据调用场景生成。full 表示完整周边经营情报；weather_only 表示用户只问天气。
                - hotelName/city/address/longitude/latitude/checkIn/checkOut 是后端为了 Dify 调试和工具 query 提供的冗余字段；若与 JSON 冲突，以 commonContextJson 和 businessParamsJson 为准。

                工具调用规则：
                - taskMode=weather_only 时，只调用高德天气工具或天气工具查询酒店所在地未来天气；不得调用联网搜索工具，不得搜索房价、竞品、热点、活动。
                - taskMode=full 时，才调用联网搜索/地图/POI/天气工具完成完整经营情报。

                必须主动搜索：
                1. 当前酒店公开房价和房型。
                2. 周边竞品酒店、民宿、客栈、酒店式公寓的公开房价和房型。
                3. 周边热门地点、商圈、景点、交通枢纽、会展中心、医院、大学、夜市、步行街。
                4. 近期活动、展会、演出、考试、赛事、节假日或本地热点。
                5. 入住日期附近天气。

                若当前 Dify 环境没有联网搜索能力，不得编造价格、事件、热点、距离或天气，必须在 unavailableFields 中说明缺少实时搜索工具。

                输出只能是严格 JSON，不能包含 Markdown、代码围栏或解释文字。字段结构如下：
                {
                  "provider": "dify_surrounding_agent",
                  "fallback": false,
                  "taskMode": "full|weather_only",
                  "queriedAt": "ISO时间",
                  "hotelProfileSuggestion": {"name":"","type":"","city":"","tags":"","targetAudience":"","nearby":"","businessArea":""},
                  "currentHotelPrices": [{"hotelName":"","roomType":"","price":"","currency":"CNY","checkIn":"","checkOut":"","platform":"","source":"","sourceUrl":"","queriedAt":"","confidence":"high|medium|low","note":""}],
                  "nearbyHotelPrices": [{"hotelName":"","distanceOrArea":"","roomType":"","price":"","currency":"CNY","checkIn":"","checkOut":"","platform":"","source":"","sourceUrl":"","queriedAt":"","confidence":"high|medium|low","note":""}],
                  "nearbyHotPlaces": [{"name":"","category":"","reason":"","distanceOrArea":"","source":"","sourceUrl":"","confidence":"high|medium|low"}],
                  "localEvents": [{"title":"","date":"","location":"","impact":"","source":"","sourceUrl":"","confidence":"high|medium|low"}],
                  "weather": {"summary":"","temperature":"","source":"","sourceUrl":"","queriedAt":"","confidence":"high|medium|low"},
                  "searchEvidence": [{"title":"","url":"","source":"","queriedAt":"","usedFor":""}],
                  "unavailableFields": []
                }

                约束：
                - 酒店价格必须是公开页面可见价格或明确标注“未找到公开实时价”。
                - 不得使用无来源数字；每条价格、事件、热点都要带 source 或 sourceUrl。
                - 搜索结果只允许酒店、民宿、客栈、酒店式公寓等住宿业态参与价格比较。
                - 不得根据搜索结果直接建议涨价、降价、促销或营销动作；这属于策略 LLM 的职责。
                - 若价格因平台登录、反爬或认证不可见，写入 unavailableFields，不得猜测。
            - id: user
              role: user
              text: |
                酒店与调用上下文：
                {{#start.commonContextJson#}}

                本次搜索参数：
                {{#start.businessParamsJson#}}

                已确认知识上下文：
                {{#start.knowledgeContextJson#}}

                显式搜索字段：
                - hotelName：{{#start.hotelName#}}
                - city：{{#start.city#}}
                - address：{{#start.address#}}
                - longitude：{{#start.longitude#}}
                - latitude：{{#start.latitude#}}
                - checkIn：{{#start.checkIn#}}
                - checkOut：{{#start.checkOut#}}
                - taskMode：{{#start.taskMode#}}
                - query：{{#start.query#}}
                - message：{{#start.message#}}
          context: {enabled: false, variable_selector: []}
          vision: {enabled: false, configs: {variable_selector: []}}
          memory:
            enabled: false
            window: {enabled: false, size: 10}
          structured_output: {enabled: false}
      - id: end
        type: custom
        height: 104
        width: 244
        position: {x: 790, y: 260}
        positionAbsolute: {x: 790, y: 260}
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          desc: 统一通过 output 返回严格 JSON
          title: 结束
          type: end
          outputs:
            - variable: output
              value_selector: [llm, text]
              value_type: string
    viewport: {x: 0, y: 0, zoom: 0.8}
