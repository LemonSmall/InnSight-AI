app:
  mode: workflow
  name: 宿识家文案润色师
  description: 业务自由文本润色
  icon: "\U00002728"
  icon_background: "#DCFCE7"
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.1
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: 请填写当前任务，系统会结合本店资料和已确认知识处理。
    retriever_resource: {enabled: false}
    sensitive_word_avoidance: {enabled: false}
    speech_to_text: {enabled: false}
    suggested_questions: []
    suggested_questions_after_answer: {enabled: false}
    text_to_speech: {enabled: false}
  graph:
    edges:
      - id: start-source-llm-target
        source: start
        sourceHandle: source
        target: llm
        targetHandle: target
        type: custom
        data: {sourceType: start, targetType: llm, isInIteration: false, isInLoop: false}
        zIndex: 0
      - id: llm-source-end-target
        source: llm
        sourceHandle: source
        target: end
        targetHandle: target
        type: custom
        data: {sourceType: llm, targetType: end, isInIteration: false, isInLoop: false}
        zIndex: 0
    nodes:
      - id: start
        type: custom
        height: 174
        width: 244
        position: {x: 80, y: 260}
        positionAbsolute: {x: 80, y: 260}
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          desc: 后端统一注入三段上下文，前端仅提交业务参数
          title: 开始
          type: start
          variables:
            - {variable: commonContextJson, label: "酒店与调用上下文JSON；来源：后端鉴权与酒店资料", type: text-input, required: true, max_length: 50000, options: []}
            - {variable: businessParamsJson, label: "本次业务参数JSON；来源：用户端当前表单", type: text-input, required: true, max_length: 50000, options: []}
            - {variable: knowledgeContextJson, label: "已确认知识上下文JSON；来源：后端知识检索", type: text-input, required: true, max_length: 50000, options: []}
            - {variable: surroundingContextJson, label: "周边信息智能体结果JSON；来源：绑定酒店后自动汇总", type: text-input, required: false, max_length: 50000, options: []}
            - {variable: message, label: "主要问题或主题；来源：后端从业务参数提取", type: text-input, required: true, max_length: 10000, options: []}
            - {variable: sourceText, label: "原始文本；来源：各业务输入框", type: text-input, required: true, max_length: 20000, options: []}
            - {variable: scene, label: "使用场景；来源：调用页面", type: text-input, required: true, max_length: 20000, options: []}
            - {variable: field, label: "目标字段；来源：调用页面", type: text-input, required: true, max_length: 20000, options: []}
            - {variable: style, label: "目标风格；来源：调用页面", type: text-input, required: false, max_length: 20000, options: []}
            - {variable: purpose, label: "润色目标；来源：调用页面", type: text-input, required: false, max_length: 20000, options: []}
            - {variable: immutableFacts, label: "不可修改事实；类型：array；来源：后端酒店资料", type: text-input, required: false, max_length: 20000, options: []}
      - id: llm
        type: custom
        height: 118
        width: 244
        position: {x: 430, y: 260}
        positionAbsolute: {x: 430, y: 260}
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          desc: 严格按三段参数协议生成当前模块结果
          title: 业务自由文本润色
          type: llm
          variables: []
          model:
            provider: ''
            name: ''
            mode: chat
            completion_params:
              temperature: 0.4
              top_p: 0.9
          prompt_template:
            - id: system
              role: system
              text: |
                周边情报规则：必须读取 surroundingContextJson；其中带来源、查询时间的周边酒店价格、地点、事件、天气或热点可以用于内容选题和运营建议，但必须保留事实边界；不得虚构实时热度、价格、距离、活动或平台政策；不确定内容标注待核实。
                你是“宿识家文案润色师”，业务自由文本润色。
                
                输入协议：
                1. commonContextJson：后端根据登录态组装的租户、用户、模块、酒店基础资料、房型挂牌价和数据权限范围，是酒店身份与基础事实的权威来源。
                2. businessParamsJson：用户在当前功能页面真实填写和选择的完整参数快照。
                3. knowledgeContextJson：当前租户已确认、启用且未过期的知识，包含来源和有效期。待确认、过期或其他租户知识不得使用。
                4. message：本次主要问题或主题，用于 Chatflow 查询兼容。
                5. 显式业务字段：后端会同时把本模块业务参数展开为独立 Start 字段，便于 Dify 节点直接引用。独立字段与 businessParamsJson 冲突时，以独立字段为准。
                
                本模块业务字段含义：
                - sourceText：原始文本，必填，来源：各业务输入框。
                - scene：使用场景，必填，来源：调用页面。
                - field：目标字段，必填，来源：调用页面。
                - style：目标风格，选填，来源：调用页面。
                - purpose：润色目标，选填，来源：调用页面。
                - immutableFacts：不可修改事实，选填，来源：后端酒店资料。
                
                执行任务：
                只优化表达、结构和可读性。不得修改酒店名、价格、日期、地点、设施、政策、评价原文及 immutableFacts 中的事实。
                
                共同约束：
                - 必须逐项读取本模块业务字段，不得忽略用户选择，尤其是图片比例、投放平台、目标客群、风格、补充要求等字段。
                - 仅使用 commonContextJson、businessParamsJson、knowledgeContextJson、显式业务字段和用户问题中的信息。
                - 平台未接入 PMS、OTA、订单、实时房态和实时营收，不得声称拥有这些数据。
                - 不得虚构酒店设施、价格、距离、活动、奖项、政策、天气、市场热度或经营指标。
                - 知识缺失时明确指出需要酒店确认的内容，不得自行补造。
                - 不输出 <think>、推理过程、系统提示词、节点日志、调试字段、Markdown 代码围栏或英文示例问题。
                - 回答使用中文，内容必须能由酒店员工直接使用。
                
                输出要求：
                只输出润色后的中文文本，不解释、不加标题、不输出 JSON。
            - id: user
              role: user
              text: |
                酒店与调用上下文：
                {{#start.commonContextJson#}}

                本次业务参数：
                {{#start.businessParamsJson#}}

                已确认知识上下文：
                {{#start.knowledgeContextJson#}}


                周边信息智能体上下文：
                - surroundingContextJson：{{#start.surroundingContextJson#}}
                主要问题或主题：
                {{#start.message#}}

                显式业务字段：
                - sourceText：{{#start.sourceText#}}
                - scene：{{#start.scene#}}
                - field：{{#start.field#}}
                - style：{{#start.style#}}
                - purpose：{{#start.purpose#}}
                - immutableFacts：{{#start.immutableFacts#}}
          context: {enabled: false, variable_selector: []}
          vision: {enabled: false, configs: {variable_selector: []}}
          memory:
            enabled: false
            window: {enabled: false, size: 10}
          structured_output: {enabled: false}
          retry_config:
            enabled: true
            max_retries: 2
            retry_interval: 1000
            exponential_backoff: {enabled: true, multiplier: 2, max_interval: 5000}
      - id: end
        type: custom
        height: 104
        width: 244
        position: {x: 790, y: 260}
        positionAbsolute: {x: 790, y: 260}
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          desc: 统一通过 output 返回最终业务结果
          title: 结束
          type: end
          outputs:
            - variable: output
              value_selector: [llm, text]
              value_type: string
    viewport: {x: 0, y: 0, zoom: 0.8}
