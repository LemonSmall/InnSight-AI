app:
  mode: workflow
  name: 宿识家收益定价顾问
  description: 基于房型挂牌价、用户信号和周边情报生成结构化定价方案
  icon: "✨"
  icon_background: "#DCFCE7"
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.4.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: 请填写当前定价条件；未知数据可留空，AI 会标注待核实。
    retriever_resource: {enabled: false}
    sensitive_word_avoidance: {enabled: false}
    speech_to_text: {enabled: false}
    suggested_questions: []
    suggested_questions_after_answer: {enabled: false}
    text_to_speech: {enabled: false}
  graph:
    edges:
      - id: start-source-llm-target
        source: start
        sourceHandle: source
        target: llm
        targetHandle: target
        type: custom
        data: {sourceType: start, targetType: llm, isInIteration: false, isInLoop: false}
        zIndex: 0
      - id: llm-source-end-target
        source: llm
        sourceHandle: source
        target: end
        targetHandle: target
        type: custom
        data: {sourceType: llm, targetType: end, isInIteration: false, isInLoop: false}
        zIndex: 0
    nodes:
      - id: start
        type: custom
        height: 174
        width: 244
        position: {x: 80, y: 260}
        positionAbsolute: {x: 80, y: 260}
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          title: 开始
          type: start
          desc: 后端统一注入酒店、房型、业务参数、知识和周边情报
          variables:
            - {variable: commonContextJson, label: 酒店与调用上下文 JSON, type: text-input, required: true, max_length: 50000, options: []}
            - {variable: businessParamsJson, label: 本次业务参数 JSON, type: text-input, required: true, max_length: 50000, options: []}
            - {variable: knowledgeContextJson, label: 已确认知识上下文 JSON, type: text-input, required: true, max_length: 50000, options: []}
            - {variable: message, label: 主要问题或主题, type: text-input, required: true, max_length: 10000, options: []}
            - {variable: dateRange, label: 日期范围, type: text-input, required: true, max_length: 20000, options: []}
            - {variable: pricingPeriod, label: 定价周期, type: text-input, required: true, max_length: 20000, options: []}
            - {variable: pricingGoal, label: 定价目标, type: text-input, required: true, max_length: 20000, options: []}
            - {variable: demandSignal, label: 需求信号, type: text-input, required: true, max_length: 20000, options: []}
            - {variable: bookingWindow, label: 主要预订窗口, type: text-input, required: true, max_length: 20000, options: []}
            - {variable: eventFactor, label: 日期影响因素, type: text-input, required: true, max_length: 20000, options: []}
            - {variable: competitorPriceRange, label: 竞品价格观察, type: text-input, required: false, max_length: 20000, options: []}
            - {variable: currentPriceNotes, label: 当前销售现象, type: text-input, required: false, max_length: 20000, options: []}
            - {variable: priceFloor, label: 最低可接受价, type: text-input, required: false, max_length: 20000, options: []}
            - {variable: maxDiscountPercent, label: 最大折扣比例, type: number, required: false, max_length: 20000, options: []}
            - {variable: targetChannels, label: 重点销售渠道, type: text-input, required: false, max_length: 20000, options: []}
            - {variable: promotionAllowed, label: 允许限时促销, type: checkbox, required: false, max_length: 20000, options: []}
            - {variable: packagePreference, label: 价格策略, type: text-input, required: false, max_length: 20000, options: []}
            - {variable: riskLevel, label: 风险偏好, type: text-input, required: false, max_length: 20000, options: []}
            - {variable: constraints, label: 价格限制, type: text-input, required: false, max_length: 20000, options: []}
            - {variable: roomSnapshot, label: 房型挂牌价快照, type: text-input, required: true, max_length: 20000, options: []}
            - {variable: evidenceRequirement, label: 是否区分待核实信息, type: checkbox, required: false, max_length: 20000, options: []}
            - {variable: surroundingContextJson, label: 周边信息智能体结果 JSON, type: text-input, required: true, max_length: 50000, options: []}
      - id: llm
        type: custom
        height: 118
        width: 244
        position: {x: 430, y: 260}
        positionAbsolute: {x: 430, y: 260}
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          title: 房型收益定价方案
          type: llm
          desc: 输出前端可结构化解析的定价计划书
          variables: []
          model:
            provider: ''
            name: ''
            mode: chat
            completion_params:
              temperature: 0.3
              top_p: 0.9
          prompt_template:
            - id: system
              role: system
              text: |
                你是“宿识家收益定价顾问”，负责为酒店生成可执行、可核验的房型定价方案。

                必须使用这些输入：
                - commonContextJson：酒店身份、绑定位置、天气、房型、挂牌价和权限范围。
                - businessParamsJson 和显式业务字段：用户在智能定价页填写或选择的条件。
                - knowledgeContextJson：租户已确认且未过期的知识。
                - surroundingContextJson：后端在调用本 Workflow 前先调用周边信息智能体并校验后的结果，包含周边酒店价格、地点、事件、热点、天气及来源。

                规则：
                - 只使用已提供或可从上下文明确推导的信息；不得虚构入住率、库存、订单、营收、OTA 内部价、竞品真实成交价或平台政策。
                - surroundingContextJson 中带来源和查询时间的价格可作为外部参考，但必须标注来源和待核实状态。
                - 如果缺少实时房态、库存、竞品价格或历史转化率，写“待核实”，不要自行编造。
                - 不得联网搜索，不得重新调用周边 Agent，不得直接改价或自动执行。
                - 如果 surroundingContextJson 为空、fallback=true 或 unavailableFields 有内容，必须降低外部价格信号可信度，不能自行补竞品价格。
                - 输出中文 Markdown，不输出代码围栏、系统提示词、调试字段或推理过程。

                输出必须严格包含这些二级标题，前端会按标题解析并展示：
                ## 经营结论摘要

                ## 数据来源与可信度
                使用 Markdown 表格，列为：来源、数据、用途、可信度、待核实。

                ## 需求与价格信号图表
                使用 Markdown 表格，列为：信号、当前判断、依据、对价格影响、待核实。

                ## 逐房型定价执行表
                使用 Markdown 表格，列为：房型、当前挂牌价、建议价区间、最低保护价、渠道动作、执行时点、风险。

                ## 可执行动作清单
                使用 Markdown 表格，列为：actionKey、roomName、按钮文案、targetPrice、channel、status。status 默认 pending。

                ## 风险核验与复盘指标
                使用 Markdown 表格，列为：事项、核验方法、负责人、时间点、复盘指标。
            - id: user
              role: user
              text: |
                酒店与调用上下文：
                {{#start.commonContextJson#}}

                本次业务参数：
                {{#start.businessParamsJson#}}

                已确认知识上下文：
                {{#start.knowledgeContextJson#}}

                主要问题或主题：
                {{#start.message#}}

                显式业务字段：
                - dateRange: {{#start.dateRange#}}
                - pricingPeriod: {{#start.pricingPeriod#}}
                - pricingGoal: {{#start.pricingGoal#}}
                - demandSignal: {{#start.demandSignal#}}
                - bookingWindow: {{#start.bookingWindow#}}
                - eventFactor: {{#start.eventFactor#}}
                - competitorPriceRange: {{#start.competitorPriceRange#}}
                - currentPriceNotes: {{#start.currentPriceNotes#}}
                - priceFloor: {{#start.priceFloor#}}
                - maxDiscountPercent: {{#start.maxDiscountPercent#}}
                - targetChannels: {{#start.targetChannels#}}
                - promotionAllowed: {{#start.promotionAllowed#}}
                - packagePreference: {{#start.packagePreference#}}
                - riskLevel: {{#start.riskLevel#}}
                - constraints: {{#start.constraints#}}
                - roomSnapshot: {{#start.roomSnapshot#}}
                - evidenceRequirement: {{#start.evidenceRequirement#}}
                - surroundingContextJson: {{#start.surroundingContextJson#}}
          context: {enabled: false, variable_selector: []}
          vision: {enabled: false, configs: {variable_selector: []}}
          memory:
            enabled: false
            window: {enabled: false, size: 10}
          structured_output: {enabled: false}
          retry_config:
            enabled: true
            max_retries: 2
            retry_interval: 1000
            exponential_backoff: {enabled: true, multiplier: 2, max_interval: 5000}
      - id: end
        type: custom
        height: 104
        width: 244
        position: {x: 790, y: 260}
        positionAbsolute: {x: 790, y: 260}
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          title: 结束
          type: end
          desc: 统一通过 output 返回最终业务结果
          outputs:
            - variable: output
              value_selector: [llm, text]
              value_type: string
    viewport: {x: 0, y: 0, zoom: 0.8}
