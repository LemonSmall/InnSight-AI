app:
  mode: workflow
  name: 宿识家房态图片识别员
  description: 识别酒店历史房态表图片，输出可导入的结构化 JSON
  icon: "\U0001F4CA"
  icon_background: "#DCFCE7"
  icon_type: emoji
  use_icon_as_answer_icon: false
dependencies:
  - current_identifier: null
    type: marketplace
    value:
      marketplace_plugin_unique_identifier: langgenius/tongyi:0.2.4@72bdf0d70a10b1b9f64746ccd1bd792397598f4536872b310e77532af02ad6a6
      version: null
kind: app
version: 0.3.1
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: true
      allowed_file_types:
        - image
      allowed_file_extensions:
        - .JPG
        - .JPEG
        - .PNG
        - .WEBP
      allowed_file_upload_methods:
        - local_file
      image:
        enabled: true
        number_limits: 1
        transfer_methods:
          - local_file
      number_limits: 1
      fileUploadConfig:
        image_file_size_limit: 10
        file_size_limit: 10
        file_upload_limit: 1
        workflow_file_upload_limit: 1
    opening_statement: 请上传酒店历史房态表截图或照片。
    retriever_resource: {enabled: false}
    sensitive_word_avoidance: {enabled: false}
    speech_to_text: {enabled: false}
    suggested_questions: []
    suggested_questions_after_answer: {enabled: false}
    text_to_speech: {enabled: false}
  graph:
    edges:
      - id: start-source-llm-target
        source: start
        sourceHandle: source
        target: llm
        targetHandle: target
        type: custom
        data: {sourceType: start, targetType: llm, isInIteration: false, isInLoop: false}
        zIndex: 0
      - id: llm-source-end-target
        source: llm
        sourceHandle: source
        target: end
        targetHandle: target
        type: custom
        data: {sourceType: llm, targetType: end, isInIteration: false, isInLoop: false}
        zIndex: 0
    nodes:
      - id: start
        type: custom
        height: 260
        width: 244
        position: {x: 80, y: 260}
        positionAbsolute: {x: 80, y: 260}
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          desc: 宿识家后端上传图片，并注入通用上下文
          title: 开始
          type: start
          variables:
            - {variable: commonContextJson, label: "酒店与调用上下文 JSON", type: text-input, required: true, max_length: 50000, options: []}
            - {variable: businessParamsJson, label: "本次上传参数 JSON", type: text-input, required: true, max_length: 50000, options: []}
            - {variable: knowledgeContextJson, label: "已确认知识上下文 JSON", type: text-input, required: false, max_length: 50000, options: []}
            - {variable: message, label: "任务说明", type: text-input, required: true, max_length: 10000, options: []}
            - {variable: sourceFileName, label: "上传文件名", type: text-input, required: false, max_length: 500, options: []}
            - {variable: sourceFileType, label: "上传文件类型", type: text-input, required: false, max_length: 100, options: []}
            - {variable: sourceFileSize, label: "上传文件大小", type: number, required: false, options: []}
            - variable: image
              label: 房态表图片
              type: file
              required: true
              allowed_file_types: [image]
              allowed_file_upload_methods: [local_file]
              allowed_file_extensions: [.JPG, .JPEG, .PNG, .WEBP]
      - id: llm
        type: custom
        height: 118
        width: 244
        position: {x: 430, y: 260}
        positionAbsolute: {x: 430, y: 260}
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          desc: 视觉识别并转换为宿识家房态导入 JSON
          title: 房态图片识别
          type: llm
          variables: []
          model:
            provider: langgenius/tongyi/tongyi
            name: qwen-vl-max
            mode: chat
            completion_params:
              temperature: 0.1
              top_p: 0.8
          prompt_template:
            - id: system
              role: system
              text: |
                你是“宿识家房态图片识别员”，只负责从酒店历史房态表截图或照片中提取结构化数据。

                必须识别的字段：
                - date：营业日期，格式 YYYY-MM-DD；如果图片没有年份，但上下文能提供年份，则补全年份；仍无法确认时使用 MM-DD。
                - roomTypeName：房型名。必须去掉末尾括号及括号内备注，例如“大床房（12间）”输出“大床房”。
                - totalRooms：该房型总房量，数字。
                - occupiedRooms：已住、占用、售出、出租房数，数字。
                - remainingRooms：剩余可售、可售、余房、空房数，数字。
                - occupancyRate：入住率、出租率、占用率，0 到 1 的小数。

                计算规则：
                - totalRooms 缺失但 occupiedRooms 和 remainingRooms 存在时，totalRooms = occupiedRooms + remainingRooms。
                - occupancyRate 缺失但 occupiedRooms 和 totalRooms 存在时，occupancyRate = occupiedRooms / totalRooms，保留 4 位小数。
                - 图片中的“80%”必须输出 0.8。
                - 合计、总计、小计、汇总行不要放进 records。
                - 看不清、歧义、不确定的数据不要猜，写进 warnings。

                严格输出 JSON，不要 Markdown，不要代码围栏，不要解释，不要输出推理过程。结构如下：
                {
                  "records": [
                    {
                      "date": "YYYY-MM-DD",
                      "roomTypeName": "房型名",
                      "totalRooms": 0,
                      "occupiedRooms": 0,
                      "remainingRooms": 0,
                      "occupancyRate": 0
                    }
                  ],
                  "warnings": []
                }
            - id: user
              role: user
              text: |
                请识别这张酒店历史房态表图片：{{#start.image#}}

                酒店与调用上下文：
                {{#start.commonContextJson#}}

                本次上传参数：
                {{#start.businessParamsJson#}}

                已确认知识上下文：
                {{#start.knowledgeContextJson#}}

                文件信息：
                - sourceFileName：{{#start.sourceFileName#}}
                - sourceFileType：{{#start.sourceFileType#}}
                - sourceFileSize：{{#start.sourceFileSize#}}
          context:
            enabled: true
            variable_selector: [start, image]
          vision:
            enabled: true
            configs:
              detail: high
              variable_selector: [start, image]
          memory:
            enabled: false
            window: {enabled: false, size: 10}
          structured_output: {enabled: false}
      - id: end
        type: custom
        height: 104
        width: 244
        position: {x: 790, y: 260}
        positionAbsolute: {x: 790, y: 260}
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          desc: 统一通过 output 返回最终 JSON
          title: 结束
          type: end
          outputs:
            - variable: output
              value_selector: [llm, text]
              value_type: string
    viewport: {x: 0, y: 0, zoom: 0.8}
