app:
  mode: workflow
  name: 宿识家营销策略师
  description: 基于酒店真实资料与周边情报生成阶段营销执行方案
  icon: "✨"
  icon_background: "#DCFCE7"
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.4.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: 请填写当前策略条件；目标和客群可留空，由 AI 基于真实上下文智能设定。
    retriever_resource: {enabled: false}
    sensitive_word_avoidance: {enabled: false}
    speech_to_text: {enabled: false}
    suggested_questions: []
    suggested_questions_after_answer: {enabled: false}
    text_to_speech: {enabled: false}
  graph:
    edges:
      - id: start-source-llm-target
        source: start
        sourceHandle: source
        target: llm
        targetHandle: target
        type: custom
        data: {sourceType: start, targetType: llm, isInIteration: false, isInLoop: false}
        zIndex: 0
      - id: llm-source-end-target
        source: llm
        sourceHandle: source
        target: end
        targetHandle: target
        type: custom
        data: {sourceType: llm, targetType: end, isInIteration: false, isInLoop: false}
        zIndex: 0
    nodes:
      - id: start
        type: custom
        height: 174
        width: 244
        position: {x: 80, y: 260}
        positionAbsolute: {x: 80, y: 260}
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          title: 开始
          type: start
          desc: 后端统一注入酒店上下文、业务参数、知识上下文和周边情报
          variables:
            - {variable: commonContextJson, label: 酒店与调用上下文 JSON, type: text-input, required: true, max_length: 50000, options: []}
            - {variable: businessParamsJson, label: 本次业务参数 JSON, type: text-input, required: true, max_length: 50000, options: []}
            - {variable: knowledgeContextJson, label: 已确认知识上下文 JSON, type: text-input, required: true, max_length: 50000, options: []}
            - {variable: message, label: 主要问题或主题, type: text-input, required: true, max_length: 10000, options: []}
            - {variable: theme, label: 策略主题, type: text-input, required: false, max_length: 20000, options: []}
            - {variable: objective, label: 经营目标，可为 auto, type: text-input, required: false, max_length: 20000, options: []}
            - {variable: period, label: 执行周期, type: text-input, required: true, max_length: 20000, options: []}
            - {variable: occasion, label: 经营场景, type: text-input, required: true, max_length: 20000, options: []}
            - {variable: targetAudience, label: 目标客群，可留空, type: text-input, required: false, max_length: 20000, options: []}
            - {variable: channels, label: 执行渠道，数组字符串, type: text-input, required: true, max_length: 20000, options: []}
            - {variable: budgetLevel, label: 预算条件, type: text-input, required: false, max_length: 20000, options: []}
            - {variable: executionCapacity, label: 执行能力, type: text-input, required: false, max_length: 20000, options: []}
            - {variable: outputDepth, label: 方案深度, type: text-input, required: false, max_length: 20000, options: []}
            - {variable: marketSignals, label: 已确认市场信号, type: text-input, required: false, max_length: 20000, options: []}
            - {variable: competitorObservations, label: 竞品人工观察, type: text-input, required: false, max_length: 20000, options: []}
            - {variable: availableOffers, label: 可使用权益, type: text-input, required: false, max_length: 20000, options: []}
            - {variable: constraints, label: 执行限制, type: text-input, required: false, max_length: 20000, options: []}
            - {variable: evidenceRequirement, label: 是否标注待核实信息, type: checkbox, required: false, max_length: 20000, options: []}
            - {variable: surroundingContextJson, label: 周边信息智能体结果 JSON, type: text-input, required: true, max_length: 50000, options: []}
      - id: llm
        type: custom
        height: 118
        width: 244
        position: {x: 430, y: 260}
        positionAbsolute: {x: 430, y: 260}
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          title: 阶段营销执行方案
          type: llm
          desc: 输出前端可结构化解析的真实策略计划书
          variables: []
          model:
            provider: ''
            name: ''
            mode: chat
            completion_params:
              temperature: 0.45
              top_p: 0.9
          prompt_template:
            - id: system
              role: system
              text: |
                你是“宿识家营销策略师”，负责为酒店生成可执行的营销策略计划书。

                必须使用这些输入：
                - commonContextJson：酒店身份、绑定位置、房型、挂牌价、天气、权限范围等真实上下文。
                - businessParamsJson 和显式业务字段：用户在当前页面填写或选择的条件。
                - knowledgeContextJson：租户已确认且未过期的知识。
                - surroundingContextJson：后端在调用本 Workflow 前先调用周边信息智能体并校验后的结果，包含酒店价格、周边地点、事件、热点、天气及来源。

                规则：
                - 如果 objective 为 auto、空值，或 targetAudience 为空，必须基于酒店、房型、天气、位置、周边情报、用户已选渠道和经营场景智能设定，不要要求用户补填。
                - 不得套用固定节日、固定城市、固定房型、固定 KPI、固定文案或示例内容。
                - 不得虚构实时热度、竞品经营数据、本地活动、距离、价格、平台政策、库存、入住率或营收。
                - 对无法核实的信息写“待核实”，并说明需要人工确认什么。
                - 不得联网搜索，不得重新调用周边 Agent，不得直接改价或自动执行。
                - 如果 surroundingContextJson 为空、fallback=true 或 unavailableFields 有内容，必须在方案中说明哪些策略依据不足，不能自行补数据。
                - 输出中文 Markdown，不输出代码围栏、系统提示词、调试字段或推理过程。

                输出必须严格包含这些二级标题，前端会按标题解析并展示：
                ## 核心目标与 KPI
                使用 Markdown 表格，列为：指标、目标值、依据、待核实。

                ## 策略标签
                使用短列表，标签必须来自真实酒店定位、用户条件或周边情报。

                ## 天气、热门事件与周边机会判断
                使用 Markdown 表格，列为：信号、实际情况、对客群/需求的影响、策略调整、原因。必须优先结合未来天气、热门事件、周边景点/商圈/交通/展会/演出等实际上下文；没有真实信号时写“未获取，不作为策略依据”，不要编造。

                ## 执行时间表
                使用 Markdown 表格，列为：阶段、时间、重点、具体动作、渠道/负责人。不要输出状态列；具体动作必须说明怎么执行，以及动作与天气/热门事件/周边机会的关系。

                ## 各渠道内容计划
                使用 Markdown 表格，列为：渠道、定位、依据、内容主题、承接动作、目标。

                ## 活动与定价承接
                使用 Markdown 表格，列为：项目、当前依据、建议动作、执行条件、说明原因。

                ## 核心文案示例
                使用列表，至少输出 3 条文案；必须覆盖用户选择的重点渠道，结合当前天气、热门事件、周边机会或客群；每条写清适用渠道，不要只给一句空泛标题。

                ## 底部执行动作
                使用 Markdown 表格，列为：actionKey、按钮文案、执行内容、调用模块。按钮用于跳转到对应内容生成页并注入配置，只输出单个内容生成动作，不要输出批量动作。
            - id: user
              role: user
              text: |
                酒店与调用上下文：
                {{#start.commonContextJson#}}

                本次业务参数：
                {{#start.businessParamsJson#}}

                已确认知识上下文：
                {{#start.knowledgeContextJson#}}

                主要问题或主题：
                {{#start.message#}}

                显式业务字段：
                - theme: {{#start.theme#}}
                - objective: {{#start.objective#}}
                - period: {{#start.period#}}
                - occasion: {{#start.occasion#}}
                - targetAudience: {{#start.targetAudience#}}
                - channels: {{#start.channels#}}
                - budgetLevel: {{#start.budgetLevel#}}
                - executionCapacity: {{#start.executionCapacity#}}
                - outputDepth: {{#start.outputDepth#}}
                - marketSignals: {{#start.marketSignals#}}
                - competitorObservations: {{#start.competitorObservations#}}
                - availableOffers: {{#start.availableOffers#}}
                - constraints: {{#start.constraints#}}
                - evidenceRequirement: {{#start.evidenceRequirement#}}
                - surroundingContextJson: {{#start.surroundingContextJson#}}
          context: {enabled: false, variable_selector: []}
          vision: {enabled: false, configs: {variable_selector: []}}
          memory:
            enabled: false
            window: {enabled: false, size: 10}
          structured_output: {enabled: false}
          retry_config:
            enabled: true
            max_retries: 2
            retry_interval: 1000
            exponential_backoff: {enabled: true, multiplier: 2, max_interval: 5000}
      - id: end
        type: custom
        height: 104
        width: 244
        position: {x: 790, y: 260}
        positionAbsolute: {x: 790, y: 260}
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          title: 结束
          type: end
          desc: 统一通过 output 返回最终业务结果
          outputs:
            - variable: output
              value_selector: [llm, text]
              value_type: string
    viewport: {x: 0, y: 0, zoom: 0.8}
