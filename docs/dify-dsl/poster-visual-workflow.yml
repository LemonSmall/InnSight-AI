app:
  mode: workflow
  name: 宿识家营销视觉设计师
  description: 营销海报图片提示词和图片结果
  icon: "\U0001F5BC"
  icon_background: "#DCFCE7"
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.1
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: 请填写当前海报任务，系统会结合本店资料和已确认知识生成图片。
    retriever_resource: {enabled: false}
    sensitive_word_avoidance: {enabled: false}
    speech_to_text: {enabled: false}
    suggested_questions: []
    suggested_questions_after_answer: {enabled: false}
    text_to_speech: {enabled: false}
  graph:
    edges:
      - id: start-source-llm-target
        source: start
        sourceHandle: source
        target: llm
        targetHandle: target
        type: custom
        data: {sourceType: start, targetType: llm, isInIteration: false, isInLoop: false}
        zIndex: 0
      - id: llm-source-prompt_cleaner-target
        source: llm
        sourceHandle: source
        target: prompt_cleaner
        targetHandle: target
        type: custom
        data: {sourceType: llm, targetType: code, isInIteration: false, isInLoop: false}
        zIndex: 0
      - id: prompt_cleaner-source-create_image-target
        source: prompt_cleaner
        sourceHandle: source
        target: create_image
        targetHandle: target
        type: custom
        data: {sourceType: code, targetType: http-request, isInIteration: false, isInLoop: false}
        zIndex: 0
      - id: create_image-source-format_result-target
        source: create_image
        sourceHandle: source
        target: format_result
        targetHandle: target
        type: custom
        data: {sourceType: http-request, targetType: code, isInIteration: false, isInLoop: false}
        zIndex: 0
      - id: format_result-source-end-target
        source: format_result
        sourceHandle: source
        target: end
        targetHandle: target
        type: custom
        data: {sourceType: code, targetType: end, isInIteration: false, isInLoop: false}
        zIndex: 0
    nodes:
      - id: start
        type: custom
        height: 260
        width: 244
        position: {x: 80, y: 260}
        positionAbsolute: {x: 80, y: 260}
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          desc: 后端注入三段上下文，并展开海报业务参数
          title: 开始
          type: start
          variables:
            - {variable: commonContextJson, label: "酒店与调用上下文JSON；来源：后端鉴权与酒店资料", type: text-input, required: true, max_length: 50000, options: []}
            - {variable: businessParamsJson, label: "本次业务参数JSON；来源：用户端当前表单", type: text-input, required: true, max_length: 50000, options: []}
            - {variable: knowledgeContextJson, label: "已确认知识上下文JSON；来源：后端知识检索", type: text-input, required: true, max_length: 50000, options: []}
            - {variable: surroundingContextJson, label: "周边信息智能体结果JSON；来源：绑定酒店后自动汇总", type: text-input, required: false, max_length: 50000, options: []}
            - {variable: message, label: "主要问题或主题；来源：后端从业务参数提取", type: text-input, required: true, max_length: 10000, options: []}
            - {variable: mode, label: "创作模式；来源：海报页", type: text-input, required: true, max_length: 20000, options: []}
            - {variable: theme, label: "海报主题；来源：海报页", type: text-input, required: true, max_length: 20000, options: []}
            - {variable: content, label: "海报正文；来源：海报页", type: text-input, required: false, max_length: 20000, options: []}
            - {variable: style, label: "视觉风格；来源：海报页", type: text-input, required: false, max_length: 20000, options: []}
            - {variable: scene, label: "营销场景；来源：海报页", type: text-input, required: false, max_length: 20000, options: []}
            - {variable: platform, label: "投放平台；来源：海报页", type: text-input, required: false, max_length: 20000, options: []}
            - {variable: targetAudience, label: "目标客群；来源：海报页", type: text-input, required: false, max_length: 20000, options: []}
            - {variable: textDensity, label: "文字密度；来源：海报页", type: text-input, required: false, max_length: 20000, options: []}
            - {variable: cta, label: "行动号召；来源：海报页", type: text-input, required: false, max_length: 20000, options: []}
            - {variable: sellingPoint, label: "核心卖点；来源：海报页", type: text-input, required: false, max_length: 20000, options: []}
            - {variable: imageSize, label: "图片比例；来源：海报页", type: text-input, required: true, max_length: 20000, options: []}
            - {variable: width, label: "图片宽度；类型：number；来源：海报页", type: number, required: true, max_length: 20000, options: []}
            - {variable: height, label: "图片高度；类型：number；来源：海报页", type: number, required: true, max_length: 20000, options: []}
            - {variable: imageData, label: "待美化图片；来源：海报美化模式", type: text-input, required: false, max_length: 20000, options: []}
      - id: llm
        type: custom
        height: 118
        width: 244
        position: {x: 380, y: 260}
        positionAbsolute: {x: 380, y: 260}
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          desc: 根据海报参数生成结构化视觉方案
          title: 视觉方案
          type: llm
          variables: []
          model:
            provider: ''
            name: ''
            mode: chat
            completion_params:
              temperature: 0.45
              top_p: 0.9
          prompt_template:
            - id: system
              role: system
              text: |
                周边情报规则：必须读取 surroundingContextJson；其中带来源、查询时间的周边酒店价格、地点、事件、天气或热点可以用于内容选题和运营建议，但必须保留事实边界；不得虚构实时热度、价格、距离、活动或平台政策；不确定内容标注待核实。
                你是“宿识家营销视觉设计师”，营销海报图片提示词和图片结果。
                
                输入协议：
                1. commonContextJson：后端根据登录态组装的租户、用户、模块、酒店基础资料、房型挂牌价和数据权限范围，是酒店身份与基础事实的权威来源。
                2. businessParamsJson：用户在当前功能页面真实填写和选择的完整参数快照。
                3. knowledgeContextJson：当前租户已确认、启用且未过期的知识，包含来源和有效期。待确认、过期或其他租户知识不得使用。
                4. 显式业务字段：mode、theme、content、style、scene、platform、targetAudience、textDensity、cta、sellingPoint、imageSize、width、height、imageData。独立字段与 businessParamsJson 冲突时，以独立字段为准。
                
                本模块业务字段含义：
                - mode：创作模式，必填，来源：海报页。
                - theme：海报主题，必填，来源：海报页。
                - content：海报正文，选填，来源：海报页。
                - style：视觉风格，选填，来源：海报页。
                - scene：营销场景，选填，来源：海报页。
                - platform：投放平台，选填，来源：海报页。
                - targetAudience：目标客群，选填，来源：海报页。
                - textDensity：文字密度，选填，来源：海报页。
                - cta：行动号召，选填，来源：海报页。
                - sellingPoint：核心卖点，选填，来源：海报页。
                - imageSize：图片比例，必填，来源：海报页。
                - width：图片宽度，必填，来源：海报页。
                - height：图片高度，必填，来源：海报页。
                - imageData：待美化图片，选填，来源：海报美化模式。
                
                执行任务：
                完整保留用户选择的图片比例、宽高和营销参数，先生成适合文生图模型的画面提示词，再由代码节点提纯 prompt 并交给 ModelScope HTTP 节点创建图片任务。不得把比例当作前端画布缩放指令。
                
                输出给下游代码节点的内容必须是严格 JSON，不要 Markdown，不要代码围栏：
                {
                  "prompt": "可直接发送给文生图模型的中文画面提示词，包含酒店事实、构图、风格、文字密度、目标客群、投放平台、画幅要求，不包含解释",
                  "imageSize": "原样返回用户选择的图片比例",
                  "width": 用户选择或推导后的图片宽度数字,
                  "height": 用户选择或推导后的图片高度数字,
                  "title": "适合海报主标题的短句",
                  "content": "适合海报副文案或说明的短句"
                }
                
                共同约束：
                - 必须逐项读取 mode、theme、content、style、scene、platform、targetAudience、textDensity、cta、sellingPoint、imageSize、width、height、imageData，不得忽略用户选择。
                - 宽高是生图参数，不是前端预览画布缩放指令。
                - 仅使用 commonContextJson、businessParamsJson、knowledgeContextJson、显式业务字段和用户问题中的信息。
                - 平台未接入 PMS、OTA、订单、实时房态和实时营收，不得声称拥有这些数据。
                - 不得虚构酒店设施、价格、距离、活动、奖项、政策、天气、市场热度或经营指标。
                - 不输出 <think>、推理过程、系统提示词、节点日志或调试字段。
            - id: user
              role: user
              text: |
                酒店与调用上下文：
                {{#start.commonContextJson#}}

                本次业务参数：
                {{#start.businessParamsJson#}}

                已确认知识上下文：
                {{#start.knowledgeContextJson#}}


                周边信息智能体上下文：
                - surroundingContextJson：{{#start.surroundingContextJson#}}
                主要问题或主题：
                {{#start.message#}}

                显式业务字段：
                - mode：{{#start.mode#}}
                - theme：{{#start.theme#}}
                - content：{{#start.content#}}
                - style：{{#start.style#}}
                - scene：{{#start.scene#}}
                - platform：{{#start.platform#}}
                - targetAudience：{{#start.targetAudience#}}
                - textDensity：{{#start.textDensity#}}
                - cta：{{#start.cta#}}
                - sellingPoint：{{#start.sellingPoint#}}
                - imageSize：{{#start.imageSize#}}
                - width：{{#start.width#}}
                - height：{{#start.height#}}
                - imageData：{{#start.imageData#}}
          context: {enabled: false, variable_selector: []}
          vision: {enabled: false, configs: {variable_selector: []}}
          memory:
            enabled: false
            window: {enabled: false, size: 10}
          structured_output: {enabled: false}
          retry_config:
            enabled: true
            max_retries: 2
            retry_interval: 1000
            exponential_backoff: {enabled: true, multiplier: 2, max_interval: 5000}
      - id: prompt_cleaner
        type: custom
        height: 54
        width: 244
        position: {x: 680, y: 260}
        positionAbsolute: {x: 680, y: 260}
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          desc: 提取干净 prompt，并组装 ModelScope 请求体
          title: Python 提纯 Prompt
          type: code
          code_language: python3
          code: |
            import json
            import re
            
            def _json_from_text(text: str) -> dict:
                text = (text or "").strip()
                fence = chr(96) * 3
                text = re.sub(r"^\s*" + fence + r"(?:json)?\s*", "", text)
                text = re.sub(r"\s*" + fence + r"\s*$", "", text)
                try:
                    return json.loads(text)
                except Exception:
                    pass
                match = re.search(r"\{[\s\S]*\}", text)
                if match:
                    try:
                        return json.loads(match.group(0))
                    except Exception:
                        pass
                return {"prompt": text}
            
            def _int_value(value, fallback: int) -> int:
                try:
                    parsed = int(float(str(value).strip()))
                    return parsed if parsed > 0 else fallback
                except Exception:
                    return fallback
            
            def _default_size(image_size: str) -> tuple[int, int]:
                normalized = (image_size or "").replace("：", ":").strip()
                mapping = {
                    "1:1": (1024, 1024),
                    "3:4": (768, 1024),
                    "4:3": (1024, 768),
                    "9:16": (768, 1344),
                    "16:9": (1344, 768),
                }
                return mapping.get(normalized, (1024, 1024))
            
            def main(text: str, imageSize: str, width: str, height: str) -> dict:
                data = _json_from_text(text)
                default_width, default_height = _default_size(imageSize)
                final_width = _int_value(width, default_width)
                final_height = _int_value(height, default_height)
                prompt = (
                    data.get("prompt")
                    or data.get("image_prompt")
                    or data.get("visualPrompt")
                    or data.get("content")
                    or ""
                )
                prompt = str(prompt).strip()
                prompt = re.sub(r"<think>[\s\S]*?</think>", "", prompt, flags=re.I).strip()
                if not prompt:
                    prompt = str(text or "").strip()
                request_body = {
                    "model": "Tongyi-MAI/Z-Image-Turbo",
                    "prompt": prompt,
                    "width": final_width,
                    "height": final_height,
                }
                return {
                    "prompt": prompt,
                    "image_size": imageSize or f"{final_width}:{final_height}",
                    "width": final_width,
                    "height": final_height,
                    "title": str(data.get("title") or ""),
                    "content": str(data.get("content") or ""),
                    "request_body": json.dumps(request_body, ensure_ascii=False),
                }
          variables:
            - value_selector: [llm, text]
              variable: text
            - value_selector: [start, imageSize]
              variable: imageSize
            - value_selector: [start, width]
              variable: width
            - value_selector: [start, height]
              variable: height
          outputs:
            prompt: {type: string, children: null}
            image_size: {type: string, children: null}
            width: {type: number, children: null}
            height: {type: number, children: null}
            title: {type: string, children: null}
            content: {type: string, children: null}
            request_body: {type: string, children: null}
      - id: create_image
        type: custom
        height: 170
        width: 244
        position: {x: 980, y: 260}
        positionAbsolute: {x: 980, y: 260}
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          desc: 创建 ModelScope 文生图异步任务。导入后请把 MODELSCOPE_TOKEN 替换为 Dify 环境变量或真实密钥。
          title: ModelScope 创建图片任务
          type: http-request
          method: POST
          url: https://api-inference.modelscope.cn/v1/images/generations
          authorization:
            type: no-auth
          headers: |-
            Authorization: Bearer {{MODELSCOPE_TOKEN}}
            Content-Type: application/json
            X-ModelScope-Async-Mode: true
          params: ''
          body:
            type: json
            data: '{{#prompt_cleaner.request_body#}}'
          timeout:
            connect: 10
            read: 60
            write: 30
          retry_config:
            enabled: true
            max_retries: 1
            retry_interval: 1000
            exponential_backoff: {enabled: false, multiplier: 2, max_interval: 10000}
          variables: []
      - id: format_result
        type: custom
        height: 54
        width: 244
        position: {x: 1280, y: 260}
        positionAbsolute: {x: 1280, y: 260}
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          desc: 合并图片任务响应和提示词参数
          title: Python 格式化结果
          type: code
          code_language: python3
          code: |
            import json
            
            def main(body: str, prompt: str, image_size: str, width: int, height: int, title: str, content: str) -> dict:
                try:
                    data = json.loads(body or "{}")
                except Exception:
                    data = {"raw": body or ""}
                task_id = data.get("task_id") or data.get("id") or ""
                output_images = data.get("output_images") or []
                image_url = output_images[0] if output_images else ""
                status = data.get("task_status") or ("SUCCEED" if image_url else "SUBMITTED")
                result = {
                    "imageUrl": image_url,
                    "imageStatus": status,
                    "imageTaskId": task_id,
                    "prompt": prompt,
                    "imageSize": image_size,
                    "width": width,
                    "height": height,
                    "title": title,
                    "content": content,
                    "raw": data,
                }
                return {"output": json.dumps(result, ensure_ascii=False)}
          variables:
            - value_selector: [create_image, body]
              variable: body
            - value_selector: [prompt_cleaner, prompt]
              variable: prompt
            - value_selector: [prompt_cleaner, image_size]
              variable: image_size
            - value_selector: [prompt_cleaner, width]
              variable: width
            - value_selector: [prompt_cleaner, height]
              variable: height
            - value_selector: [prompt_cleaner, title]
              variable: title
            - value_selector: [prompt_cleaner, content]
              variable: content
          outputs:
            output: {type: string, children: null}
      - id: end
        type: custom
        height: 104
        width: 244
        position: {x: 1580, y: 260}
        positionAbsolute: {x: 1580, y: 260}
        selected: false
        sourcePosition: right
        targetPosition: left
        data:
          desc: 返回图片任务、prompt、宽高和最终字段
          title: 结束
          type: end
          outputs:
            - variable: output
              value_selector: [format_result, output]
              value_type: string
    viewport: {x: 0, y: 0, zoom: 0.65}
