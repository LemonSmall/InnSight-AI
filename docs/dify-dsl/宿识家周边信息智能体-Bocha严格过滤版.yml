        data:
          code: |-
            import json

            def _first(value, *keys):
                if not isinstance(value, dict):
                    return ""
                for key in keys:
                    current = value.get(key)
                    if current not in (None, ""):
                        return str(current)
                return ""

            def _normalize_response(response):
                if response is None:
                    return []
                if isinstance(response, str):
                    try:
                        response = json.loads(response)
                    except Exception:
                        return []
                if isinstance(response, dict):
                    if isinstance(response.get("webpage"), list):
                        return response.get("webpage")
                    if isinstance(response.get("data"), dict) and isinstance(response["data"].get("webpage"), list):
                        return response["data"].get("webpage")
                    if isinstance(response.get("results"), list):
                        return response.get("results")
                if isinstance(response, list):
                    for item in response:
                        if isinstance(item, dict) and isinstance(item.get("webpage"), list):
                            return item.get("webpage")
                        if isinstance(item, dict) and isinstance(item.get("results"), list):
                            return item.get("results")
                return []

            def main(response: object) -> dict:
                contexts = _normalize_response(response)
                if not contexts:
                    return {"context": "暂无搜索结果", "evidence_count": 0}
                formatted = []
                for index, item in enumerate(contexts[:10]):
                    title = _first(item, "name", "title")
                    url = _first(item, "url", "link")
                    summary = _first(item, "summary", "snippet", "content", "description")
                    published = _first(item, "datePublished", "date", "publishedTime")
                    site = _first(item, "siteName", "site_name", "source", "name")
                    formatted.append(f"[[引用:{index + 1}]]\n网页标题:{title}\n网页链接:{url}\n网页摘要:{summary}\n发布时间:{published}\n网站名称:{site}")
                return {"context": "\n\n".join(formatted), "evidence_count": len(contexts[:10])}
          code_language: python3
