        data:
          desc: 去除思考过程和代码围栏，只返回宿识家后端可解析的 JSON 字符串
          title: JSON 输出清洗
          type: code
          code_language: python3
          code: |-
            import json
            import re

            def _strip_think(text: str) -> str:
                text = text or ""
                text = re.sub(r"<think>[\s\S]*?</think>", "", text, flags=re.I)
                text = re.sub(r"^\s*`{3}(?:json)?\s*", "", text, flags=re.I)
                text = re.sub(r"\s*`{3}\s*$", "", text)
                return text.strip()

            def _extract_json(text: str) -> dict:
                cleaned = _strip_think(text)
                try:
                    return json.loads(cleaned)
                except Exception:
                    pass
                start = cleaned.find("{")
                end = cleaned.rfind("}")
                if start >= 0 and end > start:
                    candidate = cleaned[start:end + 1]
                    try:
                        return json.loads(candidate)
                    except Exception:
                        pass
                return {
                    "provider": "bocha",
                    "fallback": True,
                    "queriedAt": "",
                    "hotelProfileSuggestion": {"name":"","type":"","city":"","tags":"","targetAudience":"","nearby":"","businessArea":""},
                    "currentHotelPrices": [],
                    "nearbyHotelPrices": [],
                    "nearbyHotPlaces": [],
                    "localEvents": [],
                    "weather": {"summary":"","source":"","queriedAt":""},
                    "searchEvidence": [],
                    "unavailableFields": ["LLM 未返回可解析 JSON，已清洗失败"],
                    "rawText": cleaned[:2000]
                }

            def main(text: str) -> dict:
                data = _extract_json(text)
                data.setdefault("provider", "bocha")
                data.setdefault("fallback", False)
                data.setdefault("currentHotelPrices", [])
                data.setdefault("nearbyHotelPrices", [])
                data.setdefault("nearbyHotPlaces", [])
                data.setdefault("localEvents", [])
                data.setdefault("searchEvidence", [])
                data.setdefault("unavailableFields", [])
                evidence = data.get("searchEvidence") or []
                useful_lists = (data.get("currentHotelPrices") or []) + (data.get("nearbyHotelPrices") or []) + (data.get("nearbyHotPlaces") or []) + (data.get("localEvents") or [])
                if not evidence and not useful_lists:
                    data["fallback"] = True
                    if not data["unavailableFields"]:
                        data["unavailableFields"] = ["联网搜索未返回可用证据"]
                return {"output": json.dumps(data, ensure_ascii=False)}
          variables:
            - value_selector:
                - llm
                - text
              value_type: string
              variable: text
          outputs:
            output:
              type: string
              children: null
          selected: false
