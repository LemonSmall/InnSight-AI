version: 0.3.0
kind: app
app:
  mode: advanced-chat
  name: 宿识家内容创作官
  description: 生成小红书、朋友圈、公众号、短视频、海报和活动内容，并输出图片提示词。
  icon: "\U0000270D"
  icon_background: "#FCE7F3"
workflow:
  features:
    file_upload:
      image:
        enabled: true
        number_limits: 10
        transfer_methods:
          - local_file
          - remote_url
    opening_statement: 请选择内容平台、主题、风格、受众和图片参数，我会按本店真实资料生成可直接使用的内容。
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
      - 生成一篇周末亲子小红书
      - 生成今天的朋友圈文案
      - 生成一套公众号推文大纲
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
      - id: start-source-llm-target
        source: start
        sourceHandle: source
        target: llm
        targetHandle: target
        type: custom
        data:
          sourceType: start
          targetType: llm
          isInIteration: false
      - id: llm-source-answer-target
        source: llm
        sourceHandle: source
        target: answer
        targetHandle: target
        type: custom
        data:
          sourceType: llm
          targetType: answer
          isInIteration: false
    nodes:
      - id: start
        type: custom
        position:
          x: 80
          y: 260
        positionAbsolute:
          x: 80
          y: 260
        sourcePosition: right
        targetPosition: left
        data:
          title: 开始
          type: start
          variables:
            - {variable: tenantId, label: 租户ID, type: text-input, required: true, max_length: 64, options: []}
            - {variable: taskId, label: 任务ID, type: text-input, required: false, max_length: 64, options: []}
            - {variable: moduleKey, label: 功能模块, type: text-input, required: true, max_length: 64, options: []}
            - {variable: hotelName, label: 酒店名称, type: text-input, required: false, max_length: 200, options: []}
            - {variable: hotelContext, label: 酒店上下文JSON, type: paragraph, required: false, max_length: 30000, options: []}
            - {variable: knowledge, label: 已确认知识JSON, type: paragraph, required: false, max_length: 30000, options: []}
            - {variable: selectedParamsJson, label: 用户全部选择参数JSON, type: paragraph, required: true, max_length: 30000, options: []}
            - {variable: imagePromptOverride, label: 自定义图片提示词, type: paragraph, required: false, max_length: 5000, options: []}
      - id: llm
        type: custom
        position:
          x: 430
          y: 260
        positionAbsolute:
          x: 430
          y: 260
        sourcePosition: right
        targetPosition: left
        data:
          title: 内容生成
          type: llm
          model:
            provider: openai
            name: gpt-4o
            mode: chat
            completion_params:
              temperature: 0.65
              top_p: 0.9
          prompt_template:
            - id: system
              role: system
              text: |
                你是“宿识家内容创作官”，负责酒店和民宿的内容生产。

                硬性规则：
                1. 必须逐项读取 selectedParamsJson，不能漏掉用户选择的平台、主题、语气、风格、受众、卖点、长度、图片开关、尺寸、数量等参数。
                2. 必须结合 hotelContext 和 knowledge，只使用已确认的酒店事实。
                3. 不得虚构设施、景观、餐饮、活动、价格、距离、政策或服务。
                4. 不输出 <think>、推理过程、Markdown 代码围栏或解释文字。
                5. 只输出一个合法 JSON 对象，便于项目解析和保存。
                6. 图片开启时必须生成适合文生图模型的中文 image_prompt；未开启时 image_prompt 为空。
                7. 用户提供 imagePromptOverride 时，以它为核心补全画面，不得改变用户意图。

                JSON 输出结构：
                {
                  "moduleKey": "xhs|wechat|video|article|poster|other",
                  "title": "主标题",
                  "content": "最终正文或脚本",
                  "summary": "一句话摘要",
                  "tags": ["标签"],
                  "cover_text": "封面短句",
                  "publish_tips": "简短发布建议",
                  "image_required": true,
                  "image_size": "3:4",
                  "image_count": 1,
                  "image_prompt": "完整中文图片提示词",
                  "used_params": {}
                }
            - id: user
              role: user
              text: |
                租户：{{#start.tenantId#}}
                任务：{{#start.taskId#}}
                功能模块：{{#start.moduleKey#}}
                酒店：{{#start.hotelName#}}

                酒店上下文：
                {{#start.hotelContext#}}

                已确认知识：
                {{#start.knowledge#}}

                用户全部选择参数：
                {{#start.selectedParamsJson#}}

                自定义图片提示词：
                {{#start.imagePromptOverride#}}

                用户补充要求：
                {{#sys.query#}}
          context:
            enabled: false
            variable_selector: []
          vision:
            enabled: true
      - id: answer
        type: custom
        position:
          x: 780
          y: 260
        positionAbsolute:
          x: 780
          y: 260
        sourcePosition: right
        targetPosition: left
        data:
          title: 回复
          type: answer
          answer: "{{#llm.text#}}"
